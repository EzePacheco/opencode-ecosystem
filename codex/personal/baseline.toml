# Fragmento portable alineado con el archivo observado 2026-10-04: no certifica parámetros runtime.
# Fedora: revisar cada preferencia antes de fusionar; nunca sustituir la configuración completa.
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
